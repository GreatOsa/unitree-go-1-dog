controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
 
joint_trajectory_controller:
  ros__parameters:
    joints:
      - base_to_back_hip_right
      - base_to_back_hip_left
      - base_to_front_hip_right
      - base_to_front_hip_left
      - base_to_right_front_leg
      - base_to_left_front_leg
      - hip_to_right_back_leg
      - hip_to_left_back_leg
      - right_front_leg_to_calf
      - left_front_leg_to_calf
      - right_back_leg_to_calf
      - left_back_leg_to_calf


    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    gains:
      base_to_back_hip_right: {p: 100.0, d: 2.0}
      base_to_back_hip_left: {p: 100.0, d: 2.0}
      base_to_front_hip_right: {p: 100.0, d: 2.0}
      base_to_front_hip_left: {p: 100.0, d: 2.0}

      base_to_right_front_leg: {p: 150.0, d: 3.0}
      base_to_left_front_leg: {p: 150.0, d: 3.0}
      hip_to_right_back_leg: {p: 150.0, d: 3.0}
      hip_to_left_back_leg: {p: 150.0, d: 3.0}

      right_front_leg_to_calf: {p: 200.0, d: 5.0}
      left_front_leg_to_calf: {p: 200.0, d: 5.0}
      right_back_leg_to_calf: {p: 200.0, d: 5.0}
      left_back_leg_to_calf: {p: 200.0, d: 5.0}